name: Release

# Push a `vX.Y.Z` tag (X.Y.Z must equal package.json "version") to build a DRAFT release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag must equal v + package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME != $v"; exit 1; }

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run binaries:fetch
      - run: npm run binaries:verify
      - run: npm run dist

      - name: Packaged smoke test (launch, stay up, kill)
        run: |
          $p = Start-Process dist/win-unpacked/OpenFetch.exe -PassThru
          Start-Sleep 10
          if ($p.HasExited) { throw "OpenFetch.exe exited early with code $($p.ExitCode)" }
          taskkill /PID $p.Id /T /F

      - name: Checksums and corresponding source
        shell: bash
        run: |
          mkdir release
          cp dist/OpenFetch-Setup-*.exe dist/OpenFetch-*-portable.exe THIRD_PARTY_NOTICES.md release/
          (cd release && sha256sum OpenFetch-*.exe > SHA256SUMS.txt)
          # GPL source for the shipped binaries, versions read from the pinned manifest.
          YTDLP=$(node -p "require('./resources/binary-manifest.json').binaries[0].version")
          FFMPEG=$(node -p "require('./resources/binary-manifest.json').binaries[1].source.split('/').pop()")
          MUTAGEN=1.48.1 # pinned by yt-dlp bundle/requirements/default.txt at the yt-dlp tag; bump with yt-dlp
          curl -fsSL -o "release/yt-dlp-$YTDLP-source.tar.gz" "https://github.com/yt-dlp/yt-dlp/releases/download/$YTDLP/yt-dlp.tar.gz"
          curl -fsSL -o "release/ffmpeg-$FFMPEG-source.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/$FFMPEG.tar.gz"
          curl -fsSL -o "release/mutagen-$MUTAGEN-source.tar.gz" "https://github.com/quodlibet/mutagen/archive/refs/tags/release-$MUTAGEN.tar.gz"
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3 # only a hand-off to the draft-release job

  draft-release:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write # only this job can write: it creates the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes release/*
